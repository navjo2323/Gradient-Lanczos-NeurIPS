name: Reproduction checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements/tested-macos-arm64-py311.txt -e '.[all]'
      - name: Test numerical oracles and archived data
        run: python -m pytest -q
      - name: Run stored/replay example
        run: python examples/quickstart.py
      - name: Rebuild paper figures and tables
        run: python scripts/reproduce_paper.py
      - name: Verify release inventory
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: regenerated-paper-figures-and-tables
          path: outputs/paper
